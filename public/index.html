<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프로그램 신청</title>
<style>
  :root {
    --bg: #f6f6f4;
    --card: #ffffff;
    --ink: #1c1c1a;
    --muted: #6f6f68;
    --line: #e2e2dc;
    --accent: #1c1c1a;
    --danger: #b3261e;
    --ok: #1f6f43;
    --radius: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --card: #201f1d;
      --ink: #f0efea;
      --muted: #9b9a92;
      --line: #34332f;
      --accent: #f0efea;
      --danger: #f2b8b5;
      --ok: #7fd1a4;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 32px 20px calc(48px + env(safe-area-inset-bottom));
  }

  header { margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }

  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
  }

  .field { margin-bottom: 18px; }
  .field:last-of-type { margin-bottom: 0; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
  }
  label .req { color: var(--danger); margin-left: 2px; }
  label .opt { color: var(--muted); font-weight: 400; margin-left: 4px; }

  input, select, textarea {
    width: 100%;
    padding: 12px 13px;
    font: inherit;
    font-size: 16px; /* iOS 자동 확대 방지 */
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 9px;
    appearance: none;
    transition: border-color .12s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 92px; }

  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236f6f68' stroke-width='1.6' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 13px center;
    padding-right: 36px;
  }

  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .prog-meta {
    margin-top: 8px;
    padding: 11px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 13px;
    color: var(--muted);
    display: none;
  }
  .prog-meta.show { display: block; }
  .prog-meta b { color: var(--ink); font-weight: 600; }
  .prog-meta div + div { margin-top: 3px; }

  button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--card);
    background: var(--accent);
    border: none;
    border-radius: 9px;
    cursor: pointer;
    transition: opacity .12s ease;
  }
  button:hover:not(:disabled) { opacity: .86; }
  button:disabled { opacity: .45; cursor: default; }

  .msg {
    margin-top: 16px;
    padding: 12px 13px;
    border-radius: 9px;
    font-size: 14px;
    display: none;
  }
  .msg.show { display: block; }
  .msg.err { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }

  .done {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 22px;
    text-align: center;
  }
  .done .mark {
    width: 44px; height: 44px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--ok) 16%, transparent);
    color: var(--ok);
    display: grid; place-items: center;
    font-size: 22px;
  }
  .done h2 { font-size: 18px; margin: 0 0 6px; font-weight: 650; }
  .done p { color: var(--muted); font-size: 14px; margin: 0; }
  .done .no {
    display: inline-block;
    margin-top: 14px;
    padding: 7px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .done button { background: none; color: var(--muted); border: 1px solid var(--line); margin-top: 20px; }

  .hp {
    position: absolute;
    left: -9999px;
    width: 1px; height: 1px;
    overflow: hidden;
  }

  .links { margin-top: 20px; text-align: center; font-size: 13px; }
  .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
  .links a:hover { color: var(--ink); }

  footer { margin-top: 12px; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>프로그램 신청</h1>
    <p class="sub">모집 중인 프로그램에 신청합니다.</p>
  </header>

  <form id="form" novalidate>
    <div class="field">
      <label for="programId">프로그램<span class="req">*</span></label>
      <select id="programId" name="programId" required>
        <option value="">불러오는 중…</option>
      </select>
      <div class="prog-meta" id="progMeta"></div>
    </div>

    <div class="field">
      <label for="name">이름<span class="req">*</span></label>
      <input id="name" name="name" type="text" autocomplete="name" required>
    </div>

    <div class="field">
      <label for="phone">전화번호<span class="req">*</span></label>
      <input id="phone" name="phone" type="tel" inputmode="numeric"
             autocomplete="tel" placeholder="010-1234-5678" required>
    </div>

    <div class="field">
      <label for="email">이메일<span class="req">*</span></label>
      <input id="email" name="email" type="email" inputmode="email"
             autocomplete="email" placeholder="you@example.com" required>
      <div class="hint">이전에 신청한 적 있으면 같은 연락처로 적어주세요. 기존 정보와 자동으로 연결됩니다.</div>
    </div>

    <div class="field">
      <label for="org">소속<span class="opt">선택</span></label>
      <input id="org" name="org" type="text" autocomplete="organization">
    </div>

    <div class="field">
      <label for="source">어떻게 알게 되셨나요?<span class="opt">선택</span></label>
      <select id="source" name="source">
        <option value="">선택 안 함</option>
        <option>지인추천</option>
        <option>SNS</option>
        <option>검색</option>
        <option>재참여</option>
      </select>
    </div>

    <div class="field">
      <label for="motivation">신청동기<span class="opt">선택</span></label>
      <textarea id="motivation" name="motivation"
                placeholder="참여하고 싶은 이유를 자유롭게 적어주세요."></textarea>
    </div>

    <!-- 봇 차단용. 사람 눈에는 보이지 않으므로 비어 있어야 정상 -->
    <div class="hp" aria-hidden="true">
      <label for="website">Website</label>
      <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" id="submit">신청하기</button>
    <div class="msg err" id="msg"></div>
  </form>

  <div class="links"><a href="/my">이미 신청하셨나요? 내역 조회</a></div>
  <footer>제출하신 정보는 프로그램 운영 목적으로만 사용됩니다.</footer>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const form = $('form'), sel = $('programId'), meta = $('progMeta'), msg = $('msg'), btn = $('submit');
  let programs = [];

  const won = (n) => n ? '₩' + Number(n).toLocaleString('ko-KR') : '무료';

  function showError(text) {
    msg.textContent = text;
    msg.classList.add('show');
    msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function clearError() { msg.classList.remove('show'); }

  // 프로그램 목록
  fetch('/api/programs')
    .then((r) => r.json())
    .then((d) => {
      if (!d.ok || !d.programs.length) {
        sel.innerHTML = '<option value="">현재 모집 중인 프로그램이 없습니다</option>';
        btn.disabled = true;
        return;
      }
      programs = d.programs;
      sel.innerHTML = '<option value="">선택해주세요</option>' +
        programs.map((p) => `<option value="${p.id}">${p.name}</option>`).join('');
    })
    .catch(() => {
      sel.innerHTML = '<option value="">목록을 불러오지 못했습니다</option>';
      btn.disabled = true;
    });

  sel.addEventListener('change', () => {
    const p = programs.find((x) => x.id === sel.value);
    if (!p) { meta.classList.remove('show'); return; }
    meta.innerHTML =
      `<div><b>${p.date}</b>${p.place ? ' · ' + p.place : ''}</div>` +
      `<div>참가비 <b>${won(p.price)}</b>${p.capacity ? ' · 정원 ' + p.capacity + '명' : ''}</div>`;
    meta.classList.add('show');
  });

  // 전화번호 입력 보정
  $('phone').addEventListener('input', (e) => {
    const d = e.target.value.replace(/\D/g, '').slice(0, 11);
    e.target.value = d.length > 7 ? `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`
                   : d.length > 3 ? `${d.slice(0,3)}-${d.slice(3)}`
                   : d;
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const body = Object.fromEntries(new FormData(form));
    btn.disabled = true;
    btn.textContent = '신청 중…';

    try {
      const res = await fetch('/api/apply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const d = await res.json();

      if (!d.ok) {
        showError(d.message || '신청에 실패했습니다.');
        return;
      }

      const p = programs.find((x) => x.id === body.programId);
      document.querySelector('.wrap').innerHTML = `
        <div class="done">
          <div class="mark">✓</div>
          <h2>신청이 접수되었습니다</h2>
          <p>${d.name}님, ${p ? p.name + ' ' : ''}신청이 정상 접수되었습니다.<br>
             입금 안내는 이메일로 보내드립니다.</p>
          <div class="no">신청번호 ${d.applyNo}</div>
          <button type="button" onclick="location.reload()">다른 프로그램도 신청하기</button>
        </div>`;
    } catch {
      showError('네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
    } finally {
      btn.disabled = false;
      btn.textContent = '신청하기';
    }
  });
</script>
</body>
</html>
