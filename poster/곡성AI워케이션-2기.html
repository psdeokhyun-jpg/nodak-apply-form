<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>곡성AI워케이션 2기 포스터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }

  :root {
    --sand:  #f4f1ea;
    --paper: #fbfaf7;
    --ink:   #3a3730;
    --soft:  #8b8578;
    --line:  #ddd7cb;
    --sage:  #7d8f7a;
    --deep:  #5f6f5d;
    --clay:  #b08268;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #d9d4c8;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Pretendard", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* A4 = 210 x 297mm, 96dpi 기준 794 x 1123px */
  .sheet {
    width: 794px;
    height: 1123px;
    margin: 0 auto;
    background: var(--sand);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 76px 68px 60px;
  }

  @media print {
    html, body { background: none; }
    .sheet { margin: 0; box-shadow: none; }
  }

  /* 은은한 배경 원 — 숨 쉬는 여백 */
  .halo {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--line);
    pointer-events: none;
  }
  .halo.a { width: 560px; height: 560px; top: -170px; right: -190px; }
  .halo.b { width: 340px; height: 340px; bottom: -120px; left: -110px; }

  .inner { position: relative; display: flex; flex-direction: column; height: 100%; }

  /* ── 머리 ── */
  .mark { width: 62px; height: 62px; color: var(--sage); margin-bottom: 30px; }

  .kicker {
    font-family: "Gowun Batang", serif;
    font-size: 13px;
    letter-spacing: .34em;
    color: var(--sage);
    text-transform: uppercase;
    margin-bottom: 22px;
  }

  h1 {
    font-family: "Gowun Batang", serif;
    font-size: 62px;
    font-weight: 700;
    line-height: 1.24;
    letter-spacing: -.01em;
    margin-bottom: 24px;
    word-break: keep-all;
  }

  .tagline {
    font-size: 18px;
    line-height: 1.75;
    color: var(--soft);
    max-width: 30ch;
    word-break: keep-all;
  }

  /* ── 날짜 ── */
  .date {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    margin-top: 52px;
    padding-bottom: 30px;
    border-bottom: 1px solid var(--line);
  }
  .date .big {
    font-family: "Gowun Batang", serif;
    font-size: 86px;
    font-weight: 700;
    line-height: .92;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .date .side { padding-bottom: 8px; line-height: 1.5; }
  .date .side .year { font-size: 17px; color: var(--soft); }
  .date .side .dow {
    font-family: "Gowun Batang", serif;
    font-size: 22px; font-weight: 700; color: var(--clay);
  }

  /* ── 정보 ── */
  .facts { margin-top: 30px; }
  .fact { display: flex; gap: 22px; padding: 15px 0; border-bottom: 1px solid var(--line); }
  .fact dt {
    width: 74px; flex: none;
    font-size: 13px; letter-spacing: .1em; color: var(--soft);
    padding-top: 5px;
  }
  .fact dd {
    font-family: "Gowun Batang", serif;
    font-size: 27px; font-weight: 700; line-height: 1.35;
    word-break: keep-all;
  }
  .fact dd .note { font-family: inherit; font-size: 15px; font-weight: 400; color: var(--soft); }

  /* ── 하단 QR ── */
  .foot {
    margin-top: auto;
    padding-top: 34px;
    display: flex;
    align-items: center;
    gap: 26px;
  }
  .qr {
    width: 152px; height: 152px; flex: none;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px;
  }
  .qr svg { width: 100%; height: 100%; display: block; }

  .cta .go {
    font-family: "Gowun Batang", serif;
    font-size: 27px; font-weight: 700;
    margin-bottom: 8px;
  }
  .cta .desc { font-size: 15px; color: var(--soft); line-height: 1.65; margin-bottom: 12px; }
  .cta .url {
    font-size: 13px;
    color: var(--deep);
    letter-spacing: .01em;
    padding: 6px 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 7px;
    display: inline-block;
  }

  .seat {
    position: absolute;
    right: 0; bottom: 4px;
    text-align: right;
    font-size: 13px;
    color: var(--soft);
    line-height: 1.7;
  }
  .seat b {
    font-family: "Gowun Batang", serif;
    font-size: 19px; color: var(--clay); font-weight: 700;
  }
</style>
</head>
<body>

</div>
      <div class="cta">
        <div class="go">QR로 신청하기</div>
        <p class="desc">카메라로 QR을 비추면<br>신청 페이지가 열립니다.</p>

  </div>
</div>
</body>
</html>
